[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "diffct"
version = "2.0.0"
description = "Differentiable CUDA projectors for CT: arbitrary trajectories, multi-GPU and multi-node execution, geometry gradients"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Yipeng Sun", email = "yipeng.sun@fau.de"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["computed tomography", "CT reconstruction", "differentiable programming", "CUDA", "PyTorch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy<2.5",
    "numba",
    "numba-cuda",
    "torch",
]

[project.urls]
Homepage = "https://github.com/sypsyp97/diffct"
Documentation = "https://sypsyp97.github.io/diffct/"
Changelog = "https://github.com/sypsyp97/diffct/blob/main/CHANGELOG.md"
Issues = "https://github.com/sypsyp97/diffct/issues"

[tool.hatch.build.targets.wheel]
packages = ["diffct"]

[tool.hatch.build.targets.sdist]
include = ["diffct", "tests", "pytest.ini", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE", "NOTICE"]
