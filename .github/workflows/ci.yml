name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub runners have no GPU: CUDA tests skip, the CPU tests run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numba-cuda[cu12]" -e . pytest build twine
      - name: Test
        run: pytest tests -q -rs
      - name: Build package
        run: |
          python -m build
          twine check --strict dist/*
