name: Deploy documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Never consume PR artifacts in this privileged workflow. Execute no checkout code.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ignore builds superseded on main
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main'
            });
            return data.commit.sha === context.payload.workflow_run.head_sha;
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.result == 'true'
        with:
          name: docs-html
          path: html
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Publish the built site as a Pages artifact instead of a gh-pages commit:
      # nothing generated enters the git history, and push-time scanners do not run on it.
      - uses: actions/upload-pages-artifact@v5
        if: steps.current.outputs.result == 'true'
        with:
          path: html
      - id: deployment
        if: steps.current.outputs.result == 'true'
        uses: actions/deploy-pages@v5
