name: Create Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    # Called only after CI and PyPI publishing succeed in publish.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
